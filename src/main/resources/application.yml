# IITP API 설정 파일
# 공통 설정을 포함합니다.

# 애플리케이션 정보
app:
  version: @version@
  build:
    date: @build.time@
  distance-calculation:
    # 거리 계산 방식 (자세한 설명: config/DistanceCalculationConfig.java)
    #   HAVERSINE        : 순수 SQL 하버사인 공식. DB 확장 불필요 (기본값, 운영 DB 에는 PostGIS 가 없음)
    #   POSTGIS_SPHERE   : ST_DistanceSphere / geography ST_DWithin. PostGIS 확장이 있는 DB 에서만
    #   POSTGIS_PLANAR   : 평면 ST_Distance. 결과 단위가 도(degree)라 운영 사용 금지 (호환용)
    #   POSTGRESQL_EARTH : earth_distance. cube + earthdistance 확장 필요
    method: HAVERSINE



# IITP API 환경 설정 파일
# 공통 설정만 포함
spring:
  profiles:
    active: local
  application:
    name: iitp-api
  config:
    import: optional:file:./application-${spring.profiles.active}.yml
  # datasource 설정은 각 환경별 설정 파일에서 관리
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false

# Log4j2 설정 파일 로딩
logging:
  config: classpath:log4j2-${spring.profiles.active}.xml
  level:
    root: INFO
    com.sweetk.iitp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Jasypt 로그 레벨 조정
    com.ulisesbocchio.jasyptspringboot: WARN

springdoc:
  version: @springdoc.version@
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false  # Swagger UI 비활성화
  packages-to-scan: com.sweetk.iitp.api.controller
  paths-to-match: /api/**

# API 버전 설정
# stats_data.limit_count : 기초데이터 조회 기준으로,
#                          이 값이 설정되어 있으면 설정된 count 만큼 설정해서 RES 보냄
api:
  version:
    current: v1
    supported:
      - v1
  rate-limit:
    enabled: true
    capacity: 100
    time-window: 60
  stats_data:
    limit_count: 50000

management:
  metrics:
    export:
      enabled: true
    timers:
      enabled: true  # @Timed 어노테이션 활성화/비활성화 

# 공통 설정만 포함
server:
  port: 28080
  servlet:
    context-path: /
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    max-connections: 10000
    accept-count: 100 